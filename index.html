<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameVui – Game &amp; Tiện ích online</title>
<meta name="description" content="Kho game mini và tiện ích miễn phí, chạy ngay trên trình duyệt, không cần cài đặt.">
<meta name="theme-color" content="#0f1222">
<script>try{var t=localStorage.getItem("gv_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎮%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <a class="logo" href="#/">🎮 Game<b>Vui</b></a>
  <input id="q" type="search" placeholder="🔍 Tìm game, tiện ích..." autocomplete="off">
  <button id="theme" class="icon-btn" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện">🌓</button>
</header>

<main>
  <section id="home">
    <div class="hero">
      <h1>Chơi vui, làm nhanh – <span>ngay trên trình duyệt</span></h1>
      <p id="stats"></p>
    </div>
    <nav class="tabs" id="tabs">
      <button data-t="all" class="on">Tất cả</button>
      <button data-t="game">🎮 Game</button>
      <button data-t="tool">🧰 Tiện ích</button>
      <button data-t="fav">⭐ Yêu thích</button>
    </nav>
    <div class="chips" id="chips"></div>
    <div id="grid" class="grid"></div>
    <p id="empty" class="hint" hidden>Không tìm thấy kết quả.</p>
  </section>

  <section id="view" hidden>
    <div class="vbar">
      <a class="btn ghost" href="#/">← Trang chủ</a>
      <h2 id="vtitle"></h2>
      <button class="btn ghost" id="vfav" title="Yêu thích">☆</button>
    </div>
    <div id="stage" class="stage"></div>
  </section>
</main>

<footer>GameVui · Tĩnh 100% – chạy trực tiếp từ GitHub Pages, không cần build.</footer>

<script src="js/app.js"></script>
<script src="js/games-arcade.js"></script>
<script src="js/games-puzzle.js"></script>
<script src="js/games-board.js"></script>
<script src="js/games-more.js"></script>
<script src="js/games-loto.js"></script>
<script src="js/games-loto16.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/games-loto-online.js"></script>
<script src="js/tools-basic.js"></script>
<script src="js/tools-text.js"></script>
<script src="js/tools-life.js"></script>
<script>GV.start();</script>
</body>
</html>
